map_memory_node:
  ros__parameters:
    resolution: 0.1          # m/cell
    width: 400               # cells (40 m)
    height: 400              # cells (40 m)
    origin_x: -20.0          # world position of cell (0, 0)
    origin_y: -20.0
    frame_id: "sim_world"
    distance_threshold: 1.5  # m the robot must move before fusing a new costmap
    update_period_ms: 1000
