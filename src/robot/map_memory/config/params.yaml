map_memory_node:
  ros__parameters:
    resolution: 0.1          # m/cell
    width: 600               # cells (60 m): fits every world, the widest being watonomous (55 m)
    height: 400              # cells (40 m)
    origin_x: -30.0          # world position of cell (0, 0)
    origin_y: -20.0
    frame_id: "sim_world"
    distance_threshold: 1.5  # m the robot must move before fusing a new costmap...
    max_update_interval: 2.0 # ...or s since the last fusion (so a stopped/turning robot still maps)
    update_period_ms: 1000
