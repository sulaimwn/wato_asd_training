planner_node:
  ros__parameters:
    body_margin: 0.3         # m to keep between the robot's whole body and any obstacle
    cost_weight: 3.0         # extra step cost per unit of map cost, keeps paths away from walls
    escape_radius: 1.5       # m; if the robot is already closer than body_margin to something, poses no tighter are allowed this close to it
    arrive_radius: 0.25      # m; the path may end anywhere this close to the goal (right by a wall the body only fits facing some ways)
    goal_search_radius: 1.5  # m; if the robot can't get that close, stop at the nearest reachable spot within this
    goal_tolerance: 0.5      # m, distance at which the goal counts as reached
    goal_timeout: 300.0      # s, give up on a goal after this long
    switch_distance: 1.0     # m; stay on the current route unless a new one is at least this much shorter
    axle_offset: 1.3         # m the odometry (lidar) point sits ahead of the wheel axle (robot_env.sdf)
    replan_period_ms: 500
