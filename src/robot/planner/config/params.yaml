planner_node:
  ros__parameters:
    obstacle_threshold: 50   # map cost at/above which a cell is blocked (within 0.8 m of an obstacle with the costmap's 1.6 m inflation)
    cost_weight: 3.0         # extra step cost per unit of map cost, keeps paths away from walls
    escape_radius: 1.0       # m, if the start/goal is blocked, nearby cells no costlier than it are allowed
    goal_tolerance: 0.5      # m, distance at which the goal counts as reached
    goal_timeout: 120.0      # s, give up on a goal after this long
    replan_period_ms: 500
